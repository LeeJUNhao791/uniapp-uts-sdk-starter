name: Android AAR

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-aar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK Platform 35
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35"'
      - name: Build the example and test Java callbacks
        working-directory: android-sdk
        run: ./gradlew --no-daemon verifyDemoScanner stageDemoAar
      - name: Verify the staged AAR and public manifest
        run: |
          built=android-sdk/build/outputs/aar/demo-scanner-release.aar
          staged=demo/uni_modules/ljh-sdk-starter/utssdk/app-android/libs/demo-scanner-release.aar
          test -s "$staged"
          cmp "$built" "$staged"
          python3 -c 'import json; assert json.load(open("demo/manifest.json"))["appid"] == "", "The public AppID must be empty"'
